aid: stockeld-dreamery
name: Stockeld Dreamery
description: 'Stockeld Dreamery is a Swedish food-tech company founded in Stockholm
  in early 2019 by Sorosh Tavakoli (previously founder of the video-advertising company
  Videoplaza) to reinvent animal-based staples as plant-based alternatives, starting
  with cheese. The company develops and manufactures fermented, legume-based cultured
  cheese products — including a cream cheese and a melting cheese aimed at foodservice
  — as a sustainable substitute for dairy. Backed by venture investors including Creandum
  and Northzone, Stockeld Dreamery operates as a consumer packaged-goods brand and
  does not currently publish a public API or developer program.'
